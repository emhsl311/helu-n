  /* ── час ── */
  #time { left:22px; top:60px; font-family:"Unbounded", "Manrope", sans-serif; font-weight:800; font-size:76px;
          line-height:1; letter-spacing:-1px; color:#FFF8EC; text-shadow:0 2px 18px rgba(0,0,0,.45); }
  #time .c { position:relative; top:-6px; padding:0 1px; color:#E6C17A;
             -webkit-animation:blink 2s steps(1) infinite; animation:blink 2s steps(1) infinite; }
  #sec  { display:inline-block; vertical-align:top; margin:6px 0 0 6px; padding:3px 6px 2px; border-radius:4px;
          font-family:"Manrope", sans-serif; font-weight:800; font-size:13px; line-height:1; letter-spacing:1px;
          color:#0B1116; background:#E6C17A; text-shadow:none; }
  @-webkit-keyframes blink { 0%{opacity:1} 50%{opacity:.35} }
  @keyframes blink { 0%{opacity:1} 50%{opacity:.35} }

  /* ── дата ── */
  #day  { left:26px; top:150px; font-weight:800; font-size:13px; letter-spacing:5px; color:#E6C17A; }
  #date { left:26px; top:168px; font-weight:700; font-size:22px; letter-spacing:.2px; color:#F6EEDF; }
  #rule { left:26px; top:208px; width:236px; height:1px;
          background:linear-gradient(90deg, rgba(246,238,223,.42), rgba(246,238,223,0)); }

  /* ── времето ── */
  .view { position:absolute; left:0; top:0; width:360px; height:384px; opacity:0;
          -webkit-transition:opacity 1.1s ease; transition:opacity 1.1s ease; }
  .view.show { opacity:1; }
  #wIcon { left:18px; top:222px; width:70px; height:70px; }
  #wTemp { left:96px; top:228px; font-family:"Unbounded", "Manrope", sans-serif; font-weight:800; font-size:52px;
           line-height:1; letter-spacing:-1px; color:#FFF8EC; }
  #wTemp sup { font-size:26px; position:relative; top:2px; vertical-align:top; margin-left:-2px; color:#E6C17A; }
  #wDesc { left:26px; top:298px; font-weight:800; font-size:16px; color:#F6EEDF; }
  #wMeta { left:26px; top:322px; font-weight:600; font-size:13px; color:rgba(246,238,223,.72); }
  #wMeta b { font-weight:800; color:#F6EEDF; }
  #wMeta .sep { display:inline-block; width:4px; height:4px; border-radius:2px; background:#E6C17A;
                margin:0 9px; position:relative; top:-2px; }

  #fLbl { left:26px; top:224px; font-weight:800; font-size:11px; letter-spacing:4px; color:#E6C17A; }
  .fc   { position:absolute; top:244px; width:78px; height:110px; text-align:center; }
  .fc .d  { font-weight:800; font-size:13px; letter-spacing:3px; color:#F6EEDF; margin-top:6px; }
  .fc svg { display:block; width:46px; height:46px; margin:4px auto 2px; }
  .fc .t  { font-family:"Unbounded", "Manrope", sans-serif; font-weight:700; font-size:17px; color:#FFF8EC; }
  .fc .t span { font-family:"Manrope", sans-serif; font-weight:700; font-size:14px; color:rgba(246,238,223,.6); }
  .fc + .fc { border-left:1px solid rgba(246,238,223,.14); }

  #upd { left:26px; top:358px; font-weight:600; font-size:9px; letter-spacing:1.6px; color:rgba(246,238,223,.38); }

  /* иконите */
  .spin  { -webkit-transform-origin:32px 32px; transform-origin:32px 32px; -webkit-animation:spin 30s linear infinite; animation:spin 30s linear infinite; }
  .drift { -webkit-animation:drift 7s ease-in-out infinite alternate; animation:drift 7s ease-in-out infinite alternate; }
  .drift2{ -webkit-animation:drift 9s ease-in-out -3s infinite alternate-reverse; animation:drift 9s ease-in-out -3s infinite alternate-reverse; }
  .drop  { -webkit-animation:drop 1.15s linear infinite; animation:drop 1.15s linear infinite; }
  .flake { -webkit-animation:flake 2.8s linear infinite; animation:flake 2.8s linear infinite; }
  .fog   { -webkit-animation:drift 5s ease-in-out infinite alternate; animation:drift 5s ease-in-out infinite alternate; }
  .bolt  { -webkit-animation:bolt 3.4s linear infinite; animation:bolt 3.4s linear infinite; }
  .glow  { -webkit-animation:glow 4s ease-in-out infinite; animation:glow 4s ease-in-out infinite; }
  @-webkit-keyframes spin  { to { -webkit-transform:rotate(360deg); } }
  @keyframes spin  { to { transform:rotate(360deg); } }
  @-webkit-keyframes drift { from { -webkit-transform:translateX(-2px); } to { -webkit-transform:translateX(3px); } }
  @keyframes drift { from { transform:translateX(-2px); } to { transform:translateX(3px); } }
  @-webkit-keyframes drop  { 0%{ -webkit-transform:translateY(-3px); opacity:0 } 25%{opacity:1} 100%{ -webkit-transform:translateY(11px); opacity:0 } }
  @keyframes drop  { 0%{ transform:translateY(-3px); opacity:0 } 25%{opacity:1} 100%{ transform:translateY(11px); opacity:0 } }
  @-webkit-keyframes flake { 0%{ -webkit-transform:translate(0,-3px); opacity:0 } 20%{opacity:1} 100%{ -webkit-transform:translate(2px,12px); opacity:0 } }
  @keyframes flake { 0%{ transform:translate(0,-3px); opacity:0 } 20%{opacity:1} 100%{ transform:translate(2px,12px); opacity:0 } }
  @-webkit-keyframes bolt  { 0%,62%,70%,100%{opacity:.25} 64%,68%{opacity:1} }
  @keyframes bolt  { 0%,62%,70%,100%{opacity:.25} 64%,68%{opacity:1} }
  @-webkit-keyframes glow  { 0%,100%{opacity:1} 50%{opacity:.82} }
  @keyframes glow  { 0%,100%{opacity:1} 50%{opacity:.82} }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="veil"></div>

  <div class="a" id="crest"></div>
  <div class="a" id="brand">ОБЩИНА КУБРАТ</div>

  <div class="a" id="time">--<span class="c">:</span>--</div>
  <div class="a" id="day">&nbsp;</div>
  <div class="a" id="date">&nbsp;</div>
  <div class="a" id="rule"></div>

  <div class="view show" id="vNow">
    <div class="a" id="wIcon"></div>
    <div class="a" id="wTemp"></div>
    <div class="a" id="wDesc">Зареждане на времето…</div>
    <div class="a" id="wMeta">&nbsp;</div>
  </div>
  <div class="view" id="vFc">
    <div class="a" id="fLbl">СЛЕДВАЩИТЕ ДНИ</div>
    <div class="fc" id="fc0" style="left:20px"></div>
    <div class="fc" id="fc1" style="left:98px"></div>
    <div class="fc" id="fc2" style="left:176px"></div>
  </div>

  <div class="a" id="upd">&nbsp;</div>
</div>

<script>
/* ═════════════ НАСТРОЙКИ ═════════════ */
var CONFIG = {
  title:     "ОБЩИНА КУБРАТ",
  lat:       43.7963,          // Кубрат
  lon:       26.4997,
  refreshMin: 15,              // обновяване на времето (мин.)
  cycleSec:   10,              // смяна "сега" ⇄ "следващи дни" (сек.)
  showSeconds: true
};
/* ═════════════════════════════════════ */

function $(id){ return document.getElementById(id); }
function pad(n){ return (n<10?"0":"")+n; }
var DAYS  = ["НЕДЕЛЯ","ПОНЕДЕЛНИК","ВТОРНИК","СРЯДА","ЧЕТВЪРТЪК","ПЕТЪК","СЪБОТА"];
var DSHORT= ["НД","ПН","ВТ","СР","ЧТ","ПТ","СБ"];
var MON   = ["януари","февруари","март","април","май","юни","юли","август","септември","октомври","ноември","декември"];
$("brand").textContent = CONFIG.title;

/* ── мащабиране (1:1 на 640×384, побиране на всеки друг екран) ── */
function fit(){
  var w = window.innerWidth || 640, h = window.innerHeight || 384, st = $("stage");
  var s = Math.min(w/640, h/384);
  if (Math.abs(s-1) < 0.01) s = 1;
  var x = Math.round((w-640*s)/2), y = Math.round((h-384*s)/2);
  var t = "translate("+x+"px,"+y+"px) scale("+s+")";
  st.style.webkitTransform = t; st.style.transform = t;
}
window.onresize = fit; fit();

/* ── параметри за демо ── */
var Q = {};
(location.search||"").replace(/^\?/,"").split("&").forEach(function(p){ var kv=p.split("="); if(kv[0]) Q[kv[0]]=decodeURIComponent(kv[1]||""); });

/* ── часовник ── */
var lastMin = -1;
(function tick(){
  var t = Q.time ? new Date(Q.time) : new Date();
  var sec = CONFIG.showSeconds ? '<span id="sec">'+pad(t.getSeconds())+'</span>' : '';
  if (t.getMinutes() !== lastMin || CONFIG.showSeconds) {
    if (t.getMinutes() !== lastMin) {
      lastMin = t.getMinutes();
      $("time").innerHTML = pad(t.getHours()) + '<span class="c">:</span>' + pad(t.getMinutes()) + sec;
      $("day").textContent  = DAYS[t.getDay()];
      $("date").textContent = t.getDate() + " " + MON[t.getMonth()] + " " + t.getFullYear();
    } else if ($("sec")) { $("sec").textContent = pad(t.getSeconds()); }
  }
  if (t.getHours()===3 && t.getMinutes()===0 && t.getSeconds()===0) location.reload();
  if (!Q.time) setTimeout(tick, 1000 - (Date.now()%1000) + 5);
})();

/* ── WMO кодове → текст / вид ── */
function wmo(c){
  if (c===0)  return ["Ясно","clear"];
  if (c===1)  return ["Предимно ясно","clear"];
  if (c===2)  return ["Разкъсана облачност","partly"];
  if (c===3)  return ["Облачно","cloudy"];
  if (c===45||c===48) return ["Мъгла","fog"];
  if (c>=51&&c<=55)   return ["Ръмеж","drizzle"];
  if (c===56||c===57) return ["Леден ръмеж","drizzle"];
  if (c===61) return ["Слаб дъжд","rain"];
  if (c===63) return ["Дъжд","rain"];
  if (c===65) return ["Силен дъжд","rain"];
  if (c===66||c===67) return ["Леден дъжд","rain"];
  if (c===71) return ["Слаб сняг","snow"];
  if (c===73) return ["Сняг","snow"];
  if (c===75) return ["Силен снеговалеж","snow"];
  if (c===77) return ["Снежни зърна","snow"];
  if (c===80) return ["Слаби превалявания","rain"];
  if (c===81) return ["Превалявания","rain"];
  if (c===82) return ["Силни превалявания","rain"];
  if (c===85||c===86) return ["Снеговалежи","snow"];
  if (c===95) return ["Гръмотевична буря","storm"];
  if (c===96||c===99) return ["Буря с градушка","storm"];
  return ["—","cloudy"];
}

/* ── SVG икони (64×64) ── */
var CLOUD = "M18 46A9 9 0 0 1 19 28A13 13 0 0 1 44 26A10 10 0 0 1 46 46Z";
function sun(cx,cy,r,anim){
  var rays = "";
  for (var i=0;i<8;i++){ var a=i*Math.PI/4, x1=cx+Math.cos(a)*(r+5), y1=cy+Math.sin(a)*(r+5), x2=cx+Math.cos(a)*(r+10), y2=cy+Math.sin(a)*(r+10);
    rays += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"/>'; }
  var org = 'style="-webkit-transform-origin:'+cx+'px '+cy+'px;transform-origin:'+cx+'px '+cy+'px"';
  return '<g class="'+(anim?'spin':'')+'" '+org+' stroke="#FFC94D" stroke-width="3" stroke-linecap="round">'+rays+'</g>'+
         '<circle class="glow" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#FFC94D"/>';
}
function moon(cx,cy,r){
  return '<path class="glow" fill="#F3E7C4" d="M'+(cx+r*0.35)+' '+(cy-r)+'A'+r+' '+r+' 0 1 0 '+(cx+r)+' '+(cy+r*0.45)+
         'A'+(r*0.82)+' '+(r*0.82)+' 0 0 1 '+(cx+r*0.35)+' '+(cy-r)+'Z"/>';
}
function cloud(fill,cls,dx,dy,s){
  var tr = 'transform="translate('+(dx||0)+' '+(dy||0)+') scale('+(s||1)+')"';
  return '<g '+tr+'><path class="'+(cls||'')+'" d="'+CLOUD+'" fill="'+fill+'"/></g>';
}
function iconSVG(kind, day, anim){
  var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">', i;
  var A = anim!==false;
  if (kind==="clear") s += day ? sun(32,32,11,A) : moon(30,32,15);
  else if (kind==="partly") {
    s += day ? sun(40,22,8,A) : moon(40,21,10);
    s += cloud("#EEF2F5", A?"drift":"", -4, 8, 1);
  }
  else if (kind==="cloudy") { s += cloud("#9AA6B2", A?"drift2":"", 8, -6, .82) + cloud("#EEF2F5", A?"drift":"", -4, 6, 1); }
  else if (kind==="fog") {
    s += cloud("#C9D1D8", "", 0, -6, 1);
    for (i=0;i<3;i++) s += '<line class="'+(A?'fog':'')+'" style="-webkit-animation-delay:-'+i+'s;animation-delay:-'+i+'s" x1="'+(14+i*3)+'" y1="'+(48+i*6)+'" x2="'+(50-i*3)+'" y2="'+(48+i*6)+'" stroke="#DDE3E8" stroke-width="3" stroke-linecap="round"/>';
  }
  else if (kind==="rain"||kind==="drizzle"||kind==="storm") {
    s += cloud(kind==="storm"?"#8E9AA6":"#D7DEE4", "", 0, -8, 1);
    var n = kind==="drizzle"?3:4;
    for (i=0;i<n;i++){ var x = 20+i*(24/(n-1));
      s += '<line class="'+(A?'drop':'')+'" style="-webkit-animation-delay:-'+(i*0.29).toFixed(2)+'s;animation-delay:-'+(i*0.29).toFixed(2)+'s" x1="'+x+'" y1="44" x2="'+(x-2)+'" y2="'+(kind==="drizzle"?48:51)+'" stroke="#7CC4FF" stroke-width="3" stroke-linecap="round"/>'; }
    if (kind==="storm") s += '<path class="'+(A?'bolt':'')+'" d="M34 36L26 49H32L28 60L40 45H34L38 36Z" fill="#FFD54A"/>';
  }
  else if (kind==="snow") {
    s += cloud("#E3E8EC", "", 0, -8, 1);
    for (i=0;i<4;i++){ var fx = 20+i*8;
      s += '<circle class="'+(A?'flake':'')+'" style="-webkit-animation-delay:-'+(i*0.7).toFixed(1)+'s;animation-delay:-'+(i*0.7).toFixed(1)+'s" cx="'+fx+'" cy="'+(46+(i%2)*4)+'" r="2.4" fill="#FFFFFF"/>'; }
  }
  return s + '</svg>';
}

/* ── нощ / ден ── */
var WX = null;
function isDayNow(){
  if (Q.night) return Q.night!=="1";
  var now = Q.time ? new Date(Q.time) : new Date();
  if (WX && WX.daily && WX.daily.sunrise) {
    var sr = new Date(WX.daily.sunrise[0]), ss = new Date(WX.daily.sunset[0]);
    if (!isNaN(sr) && !isNaN(ss)) return now >= sr && now < ss;
  }
  var h = now.getHours(); return h >= 7 && h < 18;
}

/* ── рендер на времето ── */
function deg(v){ var n = Math.round(v); return (n<0 ? "\u2212" + (-n) : "" + n); }
function render(d){
  WX = d;
  var c = d.current, info = wmo(c.weather_code), day = isDayNow();
  $("wIcon").innerHTML = iconSVG(info[1], day, true);
  $("wTemp").innerHTML = deg(c.temperature_2m) + "<sup>°</sup>";
  $("wDesc").textContent = info[0];
  var meta = "";
  if (d.daily) meta += "<b>↑"+deg(d.daily.temperature_2m_max[0])+"°</b>&nbsp; ↓"+deg(d.daily.temperature_2m_min[0])+"°";
  if (c.apparent_temperature!=null) meta += '<span class="sep"></span>Усеща се '+deg(c.apparent_temperature)+"°";
  if (c.wind_speed_10m!=null) meta += '<span class="sep"></span>'+Math.round(c.wind_speed_10m)+" км/ч";
  $("wMeta").innerHTML = meta;
  if (d.daily) for (var i=0;i<3;i++){
    var k=i+1, ds = d.daily.time[k]; if (!ds) continue;
    var p = ds.split("-"), dt = new Date(+p[0], +p[1]-1, +p[2]);
    $("fc"+i).innerHTML = '<div class="d">'+DSHORT[dt.getDay()]+'</div>'+
      iconSVG(wmo(d.daily.weather_code[k])[1], true, false)+
      '<div class="t">'+deg(d.daily.temperature_2m_max[k])+'° <span>/ '+deg(d.daily.temperature_2m_min[k])+'°</span></div>';
  }
  var u = d._t ? new Date(d._t) : null;
  $("upd").textContent = u ? "ВРЕМЕТО · ОБНОВЕНО " + pad(u.getHours())+":"+pad(u.getMinutes()) : "";
}

/* ── зареждане от Open-Meteo с кеш ── */
var KEY = "billboard_wx_" + CONFIG.lat + "_" + CONFIG.lon;
function load(){
  var url = "https://api.open-meteo.com/v1/forecast?latitude="+CONFIG.lat+"&longitude="+CONFIG.lon+
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day"+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset"+
    "&timezone=Europe%2FSofia&forecast_days=4";
  try {
    var x = new XMLHttpRequest();
    x.open("GET", url, true); x.timeout = 15000;
    x.onload = function(){
      if (x.status !== 200) return fallback();
      try { var d = JSON.parse(x.responseText); d._t = Date.now();
            try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){}
            render(d); } catch(e){ fallback(); }
    };
    x.onerror = x.ontimeout = fallback;
    x.send();
  } catch(e){ fallback(); }
}
function fallback(){
  var d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  if (d && d._t && Date.now()-d._t < 6*3600*1000) { if (!WX) render(d); return; }
  if (!WX) { $("wDesc").textContent = "Времето се обновява…"; $("wTemp").innerHTML = "";
           $("wIcon").innerHTML = '<div style="opacity:.35;width:100%;height:100%">'+iconSVG("cloudy", true, false)+'</div>'; }
}

/* ── демо данни ── */
function demo(code){
  var hi = code>=71&&code<=86 ? -1 : (code===0?19:12), lo = hi-7;
  var t = new Date(), iso = function(o){ var d=new Date(t.getTime()+o*864e5); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
  return { _t: Date.now(), current:{ temperature_2m: hi-3, apparent_temperature: hi-6, weather_code: code, wind_speed_10m: 14 },
    daily:{ time:[iso(0),iso(1),iso(2),iso(3)], weather_code:[code,2,61,0],
      temperature_2m_max:[hi,hi+1,hi-2,hi+3], temperature_2m_min:[lo,lo+2,lo,lo-1] } };
}


/* ── редуване "сега" ⇄ "следващи дни" ── */
var showNow = true;
setInterval(function(){
  if (!WX || !WX.daily || Q.view) return;
  showNow = !showNow;
  $("vNow").className = "view" + (showNow ? " show" : "");
  $("vFc").className  = "view" + (showNow ? "" : " show");
}, CONFIG.cycleSec*1000);

/* ── старт ── */
if (Q.demo != null && Q.demo !== "") { render(demo(+Q.demo)); }
else { fallback(); load(); setInterval(load, CONFIG.refreshMin*60*1000); }
if (Q.view === "fc") { $("vNow").className = "view"; $("vFc").className = "view show"; }
</script>
</body>
</html>
